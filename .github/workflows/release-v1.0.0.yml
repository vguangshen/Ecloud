name: Release v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.0.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore EcloudKeepAlive.csproj

      - name: Publish win-x64 single-file
        run: >-
          dotnet publish EcloudKeepAlive.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o artifact
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Verify output and package
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'artifact/EcloudKeepAlive.exe'
          if (-not (Test-Path $exe)) {
            throw 'EcloudKeepAlive.exe was not produced.'
          }

          $size = (Get-Item $exe).Length
          if ($size -lt 1MB) {
            throw "Published executable is unexpectedly small: $size bytes"
          }

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path 'artifact/EcloudKeepAlive.exe.sha256' -Value "$hash  EcloudKeepAlive.exe" -Encoding ascii

          Compress-Archive -Path $exe -DestinationPath 'artifact/EcloudKeepAlive-v1.0.0-win-x64.zip' -Force

          @'
          # EcloudKeepAlive v1.0.0

          首个正式版本。

          ## 功能
          - 定时启动移动云电脑客户端进行保活
          - 可配置启动后自动结束客户端进程及延迟时间
          - 支持开机自动运行并通过 Windows 计划任务启用无人值守保活
          - 支持自动启动 frpc
          - 支持可选的开机自动设置当前 Windows 用户密码
          - 托盘运行、立即保活、状态查看与设置持久化

          ## 下载
          - `EcloudKeepAlive.exe`：Windows x64 自包含单文件，可直接运行
          - `EcloudKeepAlive-v1.0.0-win-x64.zip`：压缩包版本
          - `EcloudKeepAlive.exe.sha256`：SHA-256 校验值

          ## 系统要求
          - Windows 10/11 x64
          - 无需单独安装 .NET Runtime
          '@ | Set-Content -Path 'release-notes.md' -Encoding utf8

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.0'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --target $env:GITHUB_SHA --title 'EcloudKeepAlive v1.0.0' --notes-file 'release-notes.md'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          gh release upload $tag `
            'artifact/EcloudKeepAlive.exe' `
            'artifact/EcloudKeepAlive-v1.0.0-win-x64.zip' `
            'artifact/EcloudKeepAlive.exe.sha256' `
            --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          gh release edit $tag --draft=false --latest --title 'EcloudKeepAlive v1.0.0' --notes-file 'release-notes.md'
