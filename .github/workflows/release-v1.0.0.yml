name: Build and release

on:
  pull_request:
    branches:
      - main
    paths:
      - '*.cs'
      - EcloudKeepAlive.csproj
      - app.manifest
      - tests/**
      - .github/workflows/release-v1.0.0.yml
  push:
    branches:
      - main
    paths:
      - '*.cs'
      - EcloudKeepAlive.csproj
      - app.manifest
      - tests/**
      - .github/workflows/release-v1.0.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content 'EcloudKeepAlive.csproj' -Raw)).Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore
        run: dotnet restore EcloudKeepAlive.csproj

      - name: Run scheduler and Windows task regression checks
        run: dotnet run --project tests/RegressionTests.csproj -c Release

      - name: Publish win-x64 single-file
        run: >-
          dotnet publish EcloudKeepAlive.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o artifact
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Verify real Windows update and restart
        shell: pwsh
        run: ./tests/UpdateSmoke.ps1 -Executable artifact/EcloudKeepAlive.exe

      - name: Verify output and package
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $exe = Join-Path $PWD 'artifact/EcloudKeepAlive.exe'
          if (-not (Test-Path $exe)) {
            throw 'EcloudKeepAlive.exe was not produced.'
          }

          $size = (Get-Item $exe).Length
          if ($size -lt 1MB) {
            throw "Published executable is unexpectedly small: $size bytes"
          }

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path 'artifact/EcloudKeepAlive.exe.sha256' -Value "$hash  EcloudKeepAlive.exe" -Encoding ascii

          Compress-Archive -Path $exe -DestinationPath "artifact/EcloudKeepAlive-v$env:APP_VERSION-win-x64.zip" -Force
          $notes = Get-Content 'RELEASE-NOTES.md' -Raw
          "# EcloudKeepAlive v$env:APP_VERSION`n`n$notes" | Set-Content 'release-notes.md' -Encoding utf8

      - name: Upload verified build for review
        uses: actions/upload-artifact@v4
        with:
          name: EcloudKeepAlive-win-x64
          path: artifact/*
          retention-days: 14

      - name: Create or update GitHub Release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:APP_VERSION"
          $existing = gh release view $tag --json isDraft,targetCommitish 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if ($release.targetCommitish -ne $env:GITHUB_SHA) { throw 'Version already exists at another commit; increment the project version.' }
            if (-not $release.isDraft) { Write-Host 'This commit is already published; leaving its assets intact.'; exit 0 }
          } else {
            gh release create $tag --draft --target $env:GITHUB_SHA --title "EcloudKeepAlive $tag" --notes-file 'release-notes.md'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          gh release upload $tag `
            'artifact/EcloudKeepAlive.exe' `
            "artifact/EcloudKeepAlive-v$env:APP_VERSION-win-x64.zip" `
            'artifact/EcloudKeepAlive.exe.sha256' `
            --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          gh release edit $tag --draft=false --latest --title "EcloudKeepAlive $tag" --notes-file 'release-notes.md'

